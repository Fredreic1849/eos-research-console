<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 348" role="img" aria-labelledby="title desc">
  <title id="title">EOS Head from audio block and script to first stop</title>
  <desc id="desc">Audio flows through layer normalization, projection and two causal convolutions. The projected script supplies keys and values for cross-attention. A unidirectional GRU carries state forward. The stop MLP receives the last state and a script summary. The separate progress pointer compares the state to script units and a sentinel.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 7 4 1 7" fill="none" stroke="#486359" stroke-width="1.2"/></marker>
  </defs>
  <style>
    text{font-family:Arial,sans-serif;fill:#172d25}
    .lane{font-size:15px;font-weight:bold;fill:#024638}
    .name{font-size:16px;font-weight:bold}
    .detail{font-size:13px;fill:#435650}
    .dims{font-family:ui-monospace,SFMono-Regular,monospace;font-size:13px}
    .connection{fill:none;stroke:#486359;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .aux{stroke-dasharray:4 4}
  </style>
  <rect x="0.5" y="0.5" width="1119" height="347" rx="6" fill="#fff" stroke="#d6e0db"/>
  <path d="M223 20v308M824 20v308" stroke="#e4ebe7"/>
  <text x="24" y="31" class="lane">Inputs</text>
  <text x="247" y="31" class="lane">Causal encoder</text>
  <text x="850" y="31" class="lane">Readouts</text>

  <path class="connection" d="M199 105H247"/>
  <path class="connection" d="M416 105H446"/>
  <path class="connection" d="M608 105H638"/>
  <path class="connection" d="M199 243H247"/>
  <path class="connection" d="M416 243H527V151"/>
  <path class="connection aux" d="M416 243H796V103H850"/>
  <path class="connection" d="M792 87H850"/>
  <path class="connection" d="M777 151V272H850"/>
  <path class="connection aux" d="M796 243H808V288H850"/>
  <path class="connection" d="M972 124V147"/>

  <rect x="24" y="62" width="175" height="87" rx="5" fill="#edf4fa" stroke="#bacbd8"/>
  <text x="38" y="86" class="name">Audio block k</text>
  <text x="38" y="111" class="dims">LATENT [B,T,64]</text>
  <text x="38" y="132" class="dims">HIDDEN [B,T,10752]</text>

  <rect x="24" y="204" width="175" height="78" rx="5" fill="#edf4fa" stroke="#bacbd8"/>
  <text x="38" y="232" class="name">Target script</text>
  <text x="38" y="257" class="dims">[B,N,5120]</text>

  <rect x="247" y="62" width="169" height="89" rx="5" fill="#f2f0f7" stroke="#ccc4db"/>
  <text x="261" y="86" class="name">Project audio</text>
  <text x="261" y="108" class="dims">[B,T,256]</text>
  <text x="261" y="132" class="detail">Causal Conv1d ×2</text>

  <rect x="446" y="62" width="162" height="89" rx="5" fill="#f2f0f7" stroke="#ccc4db"/>
  <text x="460" y="86" class="name">Cross-attention</text>
  <text x="460" y="109" class="detail">4 heads · residual</text>
  <text x="460" y="132" class="dims">[B,T,256]</text>

  <rect x="638" y="62" width="154" height="89" rx="5" fill="#f2f0f7" stroke="#ccc4db"/>
  <text x="652" y="86" class="name">One-way GRU</text>
  <text x="652" y="109" class="detail">Last valid state</text>
  <text x="652" y="132" class="dims">[B,256]</text>

  <rect x="247" y="204" width="169" height="78" rx="5" fill="#edf4fa" stroke="#bacbd8"/>
  <text x="261" y="231" class="name">Project script</text>
  <text x="261" y="256" class="dims">[B,N,256]</text>
  <text x="540" y="191" class="detail">Keys / values</text>
  <text x="561" y="230" class="detail">Script summary at readout</text>

  <rect x="850" y="51" width="244" height="73" rx="5" fill="#e8f3eb" stroke="#a7c6b5"/>
  <text x="865" y="74" class="name">Stop MLP</text>
  <text x="865" y="94" class="dims">512 → 256 → 1</text>
  <text x="865" y="113" class="detail">Logit [B] → sigmoid → pₖ [B]</text>

  <rect x="850" y="147" width="244" height="66" rx="5" fill="#e8f3eb" stroke="#a7c6b5"/>
  <text x="865" y="172" class="name">First stop</text>
  <text x="865" y="195" class="detail">pₖ ≥ τ for m consecutive blocks</text>

  <rect x="850" y="240" width="244" height="66" rx="5" fill="#f5f7f6" stroke="#c7d5ce"/>
  <text x="865" y="265" class="name">Progress pointer</text>
  <text x="865" y="288" class="dims">Logits [B,N+1]</text>

  <path d="M247 314h546" stroke="#d6e0db"/>
  <text x="247" y="333" class="detail">Carry to the next block: 2 convolution caches [B,2,256] and GRU state [1,B,256]</text>
</svg>
